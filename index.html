<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dozer Route</title>
    <meta name="description" content="Dozer Route (Dozer Rota) — maze puzzle game." />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #004645;
        --text: #f5f5f5;
        --muted: #c8e6e5;
        --card: #006664;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
      }
      main {
        max-width: 36rem;
        text-align: center;
      }
      h1 {
        font-size: 2rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 1.5rem;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      a {
        color: var(--text);
        background: var(--card);
        padding: 0.65rem 1.1rem;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        filter: brightness(1.08);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dozer Route</h1>
      <p>Dozer Rota — labirent bulmaca oyunu / maze puzzle game.</p>
      <nav>
        <a href="privacy.html">Gizlilik Politikası</a>
        <a href="privacy.html#english">Privacy Policy (EN)</a>
      </nav>
    </main>
  </body>
</html>
